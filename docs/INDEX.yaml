Firmware and Pi (not started):
  firmware/.gitkeep: Placeholder from the original scaffold; removable once firmware/src is committed.
  firmware/src/board_config.h: Pin map and fixed timing constants for the characterisation bench, in one place.
  firmware/src/control.h: Pure control maths — PID, feedforward, unit conversion. Host-pure: no pico-sdk includes, so it is testable.
  firmware/src/control.c: Implementation of the pure control maths. See control.h for the reasoning.
  firmware/src/protocol.h: The line-oriented ASCII command protocol contract. Host-pure, for the same reason.
  firmware/src/protocol.c: The command parser. See protocol.h for the contract.
  firmware/src/motor.h: TB6612FNG channel-A control for the motor under test. Host-pure header, so the maths under it stays testable.
  firmware/src/motor.c: The TB6612 hardware layer — plumbing only; the maths it uses lives in control.c and is tested on the host.
  firmware/src/quadrature.pio: PIO assembly — x4 quadrature decoding for one N20 magnetic encoder, running independently of the CPU.
  pi/.gitkeep: Placeholder. Pi 5 Python — RealSense, obstacle detection, state estimation, navigation. Its role starts at Story 2.6.
  firmware/README.md: How the firmware is laid out, the wire protocol table, and what is trustworthy before Story 1.4 measures ticks-per-rev.
  firmware/FAILSAFE.md: The link-loss failsafe: the decisions behind it and how to prove on the analyser that it works.
  firmware/CMakeLists.txt: The pico-sdk build. NEVER YET RUN — no PICO_SDK_PATH and no pioasm on this machine, so quadrature.pio is unassembled.
  firmware/src/main.c: The 100 Hz control loop, the command dispatch and the failsafe. The only file that touches all the others.
  firmware/src/encoder.h: Quadrature decoder contract. A false from encoder_init() is fatal to closed loop, not to open-loop work.
  firmware/src/encoder.c: Loads quadrature.pio into a PIO state machine and reads the count. No interrupts — that is the whole point.
  firmware/src/instrument.h: LOOP_TICK and COMPUTE_BUSY. LOOP_TICK toggles ONCE per iteration: one edge is one iteration.
  firmware/src/instrument.c: Two GPIO writes per control tick, so the analyser can measure the loop the firmware cannot measure about itself.

Repo plumbing:
  .gitignore: What never gets committed — secrets, build artefacts, and large raw captures. CSVs and manifests ARE committed.
  docs/INDEX.yaml: This file. Path to one-line purpose, for every file in the repo.
  docs/media/.gitkeep: Placeholder for bench photographs and failure videos. Film the failures too.
  tools/.gitkeep: Placeholder from the original scaffold; removable once tools/ is unambiguously populated.
