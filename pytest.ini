# Baby Rover — pytest configuration.
#
# The default invocation (`pytest`, or `make test`) runs ONLY tests that need
# no hardware. Anything that wants a real Pico or a real logic analyser must
# carry the `hardware` marker and is deselected here, by default, forever.
# Rationale: the CLOSE ritual in CLAUDE.md demands a green FULL suite before
# anything is called done. A suite that can only be run at the bench is a suite
# that does not get run.

[pytest]
testpaths = tests

# -ra            : summarise every non-passing outcome, including xfail reasons.
#                  The xfails are load-bearing here — they are the tests waiting
#                  for a module that has not been written yet.
# --strict-markers: a typo'd marker is an error, not a silently-skipped test.
# --strict-config : a typo'd ini key is an error too.
# -m "not hardware": the default deselect. `-m hardware` on the command line
#                  overrides it (last -m wins), which is what `make test-hw` does.
addopts =
    -ra
    --strict-markers
    --strict-config
    -m "not hardware"

markers =
    hardware: needs a real Pico and/or the FX2 logic analyser physically attached. Deselected by default; run with `make test-hw`.
    slow: takes more than about a second. Still runs by default; deselect with `-m "not slow"`.
    allow_subprocess: opts this test out of the autouse no-subprocess guard in conftest.py. Use it only for a genuinely inert command.

# xfail is NOT strict by default: the placeholder tests for modules that have
# not landed yet must go green (xpass) the moment the module appears, not blow
# up. Individual tests can still ask for strict=True.
xfail_strict = false
